name: Destroy Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  approve-destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Approval Gate
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Destruction Approval Required"
          issue-body: "WARNING: This will destroy all infrastructure. Approve by commenting 'approve' on this issue."

  terraform-destroy:
    runs-on: ubuntu-latest
    needs: approve-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Destroy
        env:
          TF_VAR_project_name: intro_devops
          TF_VAR_environment: dev
          TF_VAR_owner_name: ${{ secrets.OWNER_NAME }}
          TF_VAR_container_registry: "all"
          TF_VAR_github_username: ${{ github.repository_owner }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_ssh_allowed_cidrs: '["0.0.0.0/0"]'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="terraform-state-${ACCOUNT_ID}"
          cd actividad_2_4
          terraform init -backend-config="bucket=${BUCKET_NAME}"
          terraform destroy -auto-approve
          
          # Opcional: Eliminar repositorios ECR también
          echo "Cleaning up ECR repositories..."
          for TIER in frontend backend db; do
            REPO_NAME="intro_devops-dev-$TIER"
            aws ecr delete-repository --repository-name "$REPO_NAME" --force || true
          done
