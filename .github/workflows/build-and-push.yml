name: Build and push container images

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - deploy
      - test
  workflow_dispatch:

jobs:
  tests:
    name: Run unit tests and coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [express, flask]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js (Express)
        if: ${{ matrix.example == 'express' }}
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Express deps
        if: ${{ matrix.example == 'express' }}
        run: npm ci
        working-directory: express_example

      - name: Run Express tests and coverage
        if: ${{ matrix.example == 'express' }}
        run: |
          npm test
          npm run test:cov
        working-directory: express_example

      - name: Upload Express coverage artifacts
        if: ${{ matrix.example == 'express' }}
        uses: actions/upload-artifact@v4
        with:
          name: express-coverage
          path: |
            express_example/coverage/lcov.info
            express_example/coverage/coverage-final.json

      - name: Set up Python (Flask)
        if: ${{ matrix.example == 'flask' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Upgrade pip
        if: ${{ matrix.example == 'flask' }}
        run: python -m pip install --upgrade pip

      - name: Install Flask requirements
        if: ${{ matrix.example == 'flask' }}
        run: pip install -r requirements.txt pytest-cov
        working-directory: flask_example

      - name: Run Flask pytest with coverage
        if: ${{ matrix.example == 'flask' }}
        run: pytest --maxfail=1 --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json tests
        working-directory: flask_example

      - name: Upload Flask coverage artifacts
        if: ${{ matrix.example == 'flask' }}
        uses: actions/upload-artifact@v4
        with:
          name: flask-coverage
          path: |
            flask_example/coverage.xml
            flask_example/coverage.json

  build-and-push:
    needs: tests
    name: Build and push
    runs-on: ubuntu-latest
    env:
      DOCKER_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        include:
          - example: express
            context: express_example
            image: express-example
          - example: netcore
            context: netcore_example
            image: netcore-example
          - example: flask
            context: flask_example
            image: flask-example
          - example: django
            context: django_example
            image: django-example
          - example: nginx
            context: nginx_example
            image: nginx-static
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.DOCKER_NAMESPACE }}/${{ matrix.image }}:latest
