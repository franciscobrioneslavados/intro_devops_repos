name: Build and Deploy

on:
  push:
    branches:
      - actividad_2_4
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry"
        required: true
        default: "all"
        type: choice
        options: ["ecr", "github", "dockerhub", "all"]
      action:
        description: "Action"
        required: true
        default: "apply"
        type: choice
        options: ["apply", "destroy"]

jobs:
  setup-ecr:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'destroy')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Create ECR
        run: |
          for TIER in frontend backend db; do
            REPO_NAME="intro_devops-dev-$TIER"
            if ! aws ecr describe-repositories --repository-names "$REPO_NAME" > /dev/null 2>&1; then
              aws ecr create-repository --repository-name "$REPO_NAME"
            fi
          done

  build-and-push:
    runs-on: ubuntu-latest
    needs: setup-ecr
    if: always() && (needs.setup-ecr.result == 'success' || needs.setup-ecr.result == 'skipped')
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build and Push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REGISTRY_CHOICE: ${{ github.event.inputs.registry || 'all' }}
        run: |
          for TIER in frontend backend db; do
            IMAGE_NAME="intro_devops-dev-$TIER"
            docker build -t $IMAGE_NAME ./actividad_2_4/pet_store/$TIER
            if [[ "$REGISTRY_CHOICE" == "ecr" || "$REGISTRY_CHOICE" == "all" ]]; then
              docker tag $IMAGE_NAME:latest $ECR_REGISTRY/$IMAGE_NAME:latest
              docker push $ECR_REGISTRY/$IMAGE_NAME:latest
            fi
            if [[ "$REGISTRY_CHOICE" == "github" || "$REGISTRY_CHOICE" == "all" ]]; then
              GH_IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
              docker tag $IMAGE_NAME:latest $GH_IMAGE:latest
              docker push $GH_IMAGE:latest
            fi
            if [[ ("$REGISTRY_CHOICE" == "dockerhub" || "$REGISTRY_CHOICE" == "all") && -n "$DOCKERHUB_USERNAME" ]]; then
              DH_IMAGE=$(echo "$DOCKERHUB_USERNAME/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
              docker tag $IMAGE_NAME:latest $DH_IMAGE:latest
              docker push $DH_IMAGE:latest
            fi
          done

  terraform:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Action
        env:
          TF_VAR_project_name: intro_devops
          TF_VAR_environment: dev
          TF_VAR_owner_name: ${{ secrets.OWNER_NAME }}
          TF_VAR_container_registry: ${{ github.event.inputs.registry || 'all' }}
          TF_VAR_github_username: ${{ github.repository_owner }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_ssh_allowed_cidrs: '["0.0.0.0/0"]'
        run: |
          cd actividad_2_4
          terraform init
          if [ "${{ github.event.inputs.action || 'apply' }}" == "destroy" ]; then
            terraform destroy -auto-approve
          else
            terraform apply -auto-approve
          fi
