name: Build, Push and Deploy

on:
  push:
    branches: ["actividad_2_4"]
  workflow_dispatch:
    inputs:
      registry:
        description: "Registro de destino"
        required: true
        default: "all"
        type: choice
        options:
          - ecr
          - github
          - dockerhub
          - all

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'intro_devops' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'all' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.AWS_ACCESS_KEY_ID != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag, and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
          NAME_PREFIX: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}
          REGISTRY_CHOICE: ${{ inputs.registry || env.CONTAINER_REGISTRY }}
        run: |
          TIERS=("frontend" "backend" "db")
          for TIER in "${TIERS[@]}"; do
            echo "Processing $TIER..."
            IMAGE_NAME="${NAME_PREFIX}-${TIER}"
            
            # Build
            docker build -t $IMAGE_NAME ./actividad_2_4/pet_store/$TIER
            
            # Push to ECR
            if [[ ("$REGISTRY_CHOICE" == "ecr" || "$REGISTRY_CHOICE" == "all") && -n "$ECR_REGISTRY" ]]; then
              echo "Pushing to ECR..."
              docker tag $IMAGE_NAME:latest $ECR_REGISTRY/$IMAGE_NAME:latest
              docker push $ECR_REGISTRY/$IMAGE_NAME:latest
            fi
            
            # Push to GHCR
            if [[ "$REGISTRY_CHOICE" == "github" || "$REGISTRY_CHOICE" == "all" ]]; then
              echo "Pushing to GHCR..."
              GH_IMAGE_NAME=$(echo "$GHCR_REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
              docker tag $IMAGE_NAME:latest $GH_IMAGE_NAME:latest
              docker push $GH_IMAGE_NAME:latest
            fi

            # Push to Docker Hub
            if [[ ("$REGISTRY_CHOICE" == "dockerhub" || "$REGISTRY_CHOICE" == "all") && -n "$DOCKERHUB_USERNAME" ]]; then
              echo "Pushing to Docker Hub..."
              DH_IMAGE_NAME=$(echo "$DOCKERHUB_USERNAME/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
              docker tag $IMAGE_NAME:latest $DH_IMAGE_NAME:latest
              docker push $DH_IMAGE_NAME:latest
            fi
          done

      - name: Generate Deployment Summary
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
          NAME_PREFIX: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}
          REGISTRY_CHOICE: ${{ inputs.registry || env.CONTAINER_REGISTRY }}
        run: |
          echo "### Resumen de Imágenes Desplegadas" >> $GITHUB_STEP_SUMMARY
          echo "| Componente | Registro | URL de la Imagen |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|----------|-----------------|" >> $GITHUB_STEP_SUMMARY

          TIERS=("frontend" "backend" "db")
          for TIER in "${TIERS[@]}"; do
            IMAGE_NAME="${NAME_PREFIX}-${TIER}"
            
            if [[ ("$REGISTRY_CHOICE" == "ecr" || "$REGISTRY_CHOICE" == "all") && -n "$ECR_REGISTRY" ]]; then
              echo "| $TIER | ECR | \`$ECR_REGISTRY/$IMAGE_NAME:latest\` |" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [[ "$REGISTRY_CHOICE" == "github" || "$REGISTRY_CHOICE" == "all" ]]; then
              GH_IMAGE_NAME=$(echo "$GHCR_REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
              echo "| $TIER | GHCR | \`$GH_IMAGE_NAME:latest\` |" >> $GITHUB_STEP_SUMMARY
            fi

            if [[ ("$REGISTRY_CHOICE" == "dockerhub" || "$REGISTRY_CHOICE" == "all") && -n "$DOCKERHUB_USERNAME" ]]; then
              DH_IMAGE_NAME=$(echo "$DOCKERHUB_USERNAME/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
              echo "| $TIER | DockerHub | \`$DH_IMAGE_NAME:latest\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done

  terraform-deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      TF_VAR_project_name: ${{ env.PROJECT_NAME }}
      TF_VAR_environment: ${{ env.ENVIRONMENT }}
      TF_VAR_owner_name: ${{ vars.OWNER_NAME || secrets.OWNER_NAME }}
      TF_VAR_container_registry: ${{ inputs.registry || env.CONTAINER_REGISTRY }}
      TF_VAR_github_username: ${{ github.repository_owner }}
      TF_VAR_dockerhub_username: ${{ env.DOCKERHUB_USERNAME }}
      TF_VAR_ssh_allowed_cidrs: ${{ vars.SSH_ALLOWED_CIDRS || '["0.0.0.0/0"]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./actividad_2_4
        run: terraform init

      - name: Terraform Plan
        working-directory: ./actividad_2_4
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/actividad_2_4'
        working-directory: ./actividad_2_4
        run: terraform apply -auto-approve
