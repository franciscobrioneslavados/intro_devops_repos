name: Build and Deploy

on:
  push:
    branches:
      - actividad_2_4
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry"
        required: true
        default: "all"
        type: choice
        options: ["ecr", "github", "dockerhub", "all"]
      action:
        description: "Action"
        required: true
        default: "apply"
        type: choice
        options: ["apply", "destroy"]

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'destroy')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Setup Resources
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="terraform-state-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region us-east-1
          fi
          for TIER in frontend backend db; do
            REPO_NAME="intro_devops-dev-$TIER"
            if ! aws ecr describe-repositories --repository-names "$REPO_NAME" > /dev/null 2>&1; then
              aws ecr create-repository --repository-name "$REPO_NAME"
            fi
          done

  build:
    runs-on: ubuntu-latest
    needs: setup
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'destroy')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and Push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REGISTRY_CHOICE: ${{ github.event.inputs.registry || 'all' }}
        run: |
          for TIER in frontend backend db; do
            IMAGE_NAME="intro_devops-dev-$TIER"
            docker build -t $IMAGE_NAME ./actividad_2_4/pet_store/$TIER
            if [[ "$REGISTRY_CHOICE" == "ecr" || "$REGISTRY_CHOICE" == "all" ]]; then
              docker tag $IMAGE_NAME:latest $ECR_REGISTRY/$IMAGE_NAME:latest
              docker push $ECR_REGISTRY/$IMAGE_NAME:latest
            fi
          done

  approve:
    runs-on: ubuntu-latest
    # Se ejecuta si es un apply (vía push o dispatch) O si es un destroy manual
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'))
    needs: build
    steps:
      - name: Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "${{ github.event.inputs.action == 'destroy' && 'Destruction' || 'Deployment' }} Approval Required"
          issue-body: "Please approve the ${{ github.event.inputs.action || 'apply' }} by commenting 'approve'."

  deploy-or-destroy:
    runs-on: ubuntu-latest
    needs: approve
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Action
        env:
          TF_VAR_project_name: intro_devops
          TF_VAR_environment: dev
          TF_VAR_owner_name: ${{ secrets.OWNER_NAME }}
          TF_VAR_container_registry: "all"
          TF_VAR_github_username: ${{ github.repository_owner }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_ssh_allowed_cidrs: '["0.0.0.0/0"]'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="terraform-state-${ACCOUNT_ID}"
          cd actividad_2_4
          terraform init -backend-config="bucket=${BUCKET_NAME}"
          
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            terraform destroy -auto-approve
            # Cleanup ECR
            for TIER in frontend backend db; do
              aws ecr delete-repository --repository-name "intro_devops-dev-$TIER" --force || true
            done
          else
            terraform apply -auto-approve
          fi
