name: Build and Deploy

on:
  push:
    branches:
      - actividad_2_4
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry"
        required: true
        default: "all"
        type: choice
        options:
          - ecr
          - github
          - dockerhub
          - all

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test
        run: echo "Building..."

  terraform-deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test
        run: echo "Deploying..."
