name: Build and Deploy

on:
  push:
    branches:
      - actividad_2_4
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry"
        required: true
        default: "all"
        type: choice
        options:
          - ecr
          - github
          - dockerhub
          - all

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: intro_devops
  ENVIRONMENT: dev
  CONTAINER_REGISTRY: all
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build, tag, and push images
        env:
          GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
          NAME_PREFIX: ${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}
          REGISTRY_CHOICE: ${{ github.event.inputs && github.event.inputs.registry || env.CONTAINER_REGISTRY }}
        run: |
          echo "Registry choice is $REGISTRY_CHOICE"
          TIERS=("frontend" "backend" "db")
          for TIER in "${TIERS[@]}"; do
            echo "Building $TIER..."
          done

  terraform-deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      TF_VAR_project_name: ${{ env.PROJECT_NAME }}
      TF_VAR_environment: ${{ env.ENVIRONMENT }}
      TF_VAR_container_registry: ${{ github.event.inputs && github.event.inputs.registry || env.CONTAINER_REGISTRY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test
        run: echo "Deploying..."
