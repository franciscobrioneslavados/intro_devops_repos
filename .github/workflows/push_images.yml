name: Build and Deploy

on:
  push:
    branches:
      - actividad_2_4
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry"
        required: true
        default: "all"
        type: choice
        options: ["ecr", "github", "dockerhub", "all"]

env:
  PROJECT_NAME: intro_devops
  ENVIRONMENT: dev
  CONTAINER_REGISTRY: all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Choice
        run: |
          CHOICE="${{ github.event.inputs.registry || env.CONTAINER_REGISTRY }}"
          echo "Choice is $CHOICE"
