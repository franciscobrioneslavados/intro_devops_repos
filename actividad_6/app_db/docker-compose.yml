version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - DATABASE_URL=postgresql://admin:secret@db:5432/lab_db
      - NODE_NAME=${NODE_NAME:-ComposeHost}
      - INSTANCE_ID=${INSTANCE_ID:-No disponible}
      - AVAILABILITY_ZONE=${AVAILABILITY_ZONE:-Desconocida}
      - PRIVATE_IP=${PRIVATE_IP:-No disponible}
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=lab_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lab_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
